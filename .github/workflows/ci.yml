name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/verify.sh
      - name: Verify a generated project builds
        run: |
          python3 scripts/new_project.py --name SmokeNotes --package org.example.smokenotes --destination "$RUNNER_TEMP/SmokeNotes"
          cd "$RUNNER_TEMP/SmokeNotes"
          ./gradlew :androidApp:assembleDebug
      - name: Verify release shrinking
        run: |
          ./gradlew :androidApp:assembleRelease
          python3 scripts/check_apk.py androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-release-artifacts
          path: |
            androidApp/build/outputs/apk/release/*
            androidApp/build/outputs/mapping/release/**
  device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: ['26', '35', '37']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: ./gradlew :androidApp:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-${{ matrix.api }}-reports
          path: androidApp/build/reports/androidTests/**
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: brew install xcodegen
      - run: ./scripts/ios-project.sh
      - name: Compile and link shared iOS framework
        run: ./gradlew -Pkmptemplate.enableIos=true :sharedApp:linkDebugFrameworkIosSimulatorArm64 :core:common:iosSimulatorArm64Test :feature:example:iosSimulatorArm64Test
      - name: Build Swift host for simulator
        run: xcodebuild -project iosApp/KMPTemplate.xcodeproj -scheme KMPTemplate -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apple-framework-and-host
          path: |
            sharedApp/build/bin/iosSimulatorArm64/debugFramework/**
            iosApp/build/**
