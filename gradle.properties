android.useAndroidX=true
android.enableJetifier=false

org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC
org.gradle.daemon=false
org.gradle.configuration-cache=true
org.gradle.configuration-cache-problems=warn
org.gradle.parallel=true
org.gradle.caching=true

kotlin.incremental=false
kotlin.code.style=official

# iOS targets are opt-in (see build-logic BuildLogicExt.kt: Project.iosEnabled) --
# this dev machine cannot provision a Kotlin/Native host compiler for iOS at all
# (JetBrains ships no linux-aarch64 konan distribution). Pass
# -Pkmptemplate.enableIos=true on a Mac or in macOS CI to turn iOS targets on.
