name: CMPTemplate
options:
  bundleIdPrefix: com.cmptemplate
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  CMPTemplate:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        # Required by Compose Multiplatform for 120 Hz ProMotion (GameController); without it iOS logs
        # a warning and caps animations at 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmptemplate.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
        FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../common/sharedApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
        OTHER_LDFLAGS: '$(inherited) -framework SharedApp'
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew -Pcmptemplate.enableIos=true :common:sharedApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
schemes:
  CMPTemplate:
    build:
      targets:
        CMPTemplate: all
