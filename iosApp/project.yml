name: KMPTemplate
options:
  bundleIdPrefix: com.kmptemplate
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  KMPTemplate:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmptemplate.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
        FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../sharedApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
        OTHER_LDFLAGS: '$(inherited) -framework SharedApp'
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew -Pkmptemplate.enableIos=true :sharedApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
schemes:
  KMPTemplate:
    build:
      targets:
        KMPTemplate: all
