name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Android or JVM-only types in commonMain
        run: ./scripts/check_common_main_purity.sh

  build-and-test:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # KMP modules' host-test task is named `allTests` / `testAndroidHostTest`,
      # NOT `test` -- a bare `./gradlew test` silently skips most of a KMP repo.
      # :androidApp is a com.android.application, not a KMP module, so it needs
      # its own explicit testDebugUnitTest -- testAndroidHostTest never reaches it.
      - name: Core + feature module tests
        run: ./gradlew :core:model:allTests :core:common:allTests testAndroidHostTest

      - name: App tests (incl. KoinModulesTest)
        run: ./gradlew :androidApp:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # Apple targets cannot even be configured on Linux -- Kotlin/Native publishes
  # no linux-aarch64 host compiler, and framework linking needs Apple's own
  # toolchain regardless of host. This job is what actually proves the iOS
  # side still compiles once you opt into it (see gradle.properties).
  ios:
    runs-on: macos-14
    needs: static-checks
    if: false # flip on once an iOS target/app actually exists in this project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS targets
        run: ./gradlew -Pkmptemplate.enableIos=true compileKotlinIosSimulatorArm64
